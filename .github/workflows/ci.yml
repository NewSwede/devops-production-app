name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: pip install -r app/backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: app/backend
        run: pytest

  infrastructure-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Validate dev compose
        run: docker compose -f docker-compose.dev.yml config

      - name: Validate prod compose
        env:
          IMAGE_TAG: ci
        run: docker compose -f docker-compose.prod.yml config

  docker-builds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t devops-backend:ci ./app/backend

      - name: Build frontend image
        run: docker build -t devops-frontend:ci ./app/frontend
