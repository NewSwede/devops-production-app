name: Build, Push and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        run: |
          docker build -t imswede/devops-backend:${IMAGE_TAG} ./app/backend
          docker push imswede/devops-backend:${IMAGE_TAG}

      - name: Build and push frontend
        run: |
          docker build -t imswede/devops-frontend:${IMAGE_TAG} ./app/frontend
          docker push imswede/devops-frontend:${IMAGE_TAG}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/devops-production-app
            echo "IMAGE_TAG=${{ env.IMAGE_TAG }}" > .env
            docker-compose pull backend frontend
            docker-compose up -d
            docker ps