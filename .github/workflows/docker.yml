name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build backend image
        run: docker build -t imswede/devops-backend:${IMAGE_TAG} ./app/backend

      - name: Build frontend image
        run: docker build -t imswede/devops-frontend:${IMAGE_TAG} ./app/frontend

      - name: Push backend image
        run: docker push imswede/devops-backend:${IMAGE_TAG}

      - name: Push frontend image
        run: docker push imswede/devops-frontend:${IMAGE_TAG}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            sudo chown -R $USER:$USER ~/devops-production-app
            cd ~/devops-production-app
            git pull --ff-only origin main
            echo "IMAGE_TAG=$IMAGE_TAG" > .env
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Healthcheck
        run: |
          for i in {1..12}; do
            curl -fsS http://${{ secrets.EC2_HOST }}/api/health && exit 0
            sleep 5
          done
          exit 1
