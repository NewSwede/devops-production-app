name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build backend image
        run: docker build -t imswede/devops-backend:${IMAGE_TAG} ./app/backend

      - name: Build frontend image
        run: docker build -t imswede/devops-frontend:${IMAGE_TAG} ./app/frontend

      - name: Push backend image
        run: docker push imswede/devops-backend:${IMAGE_TAG}

      - name: Push frontend image
        run: docker push imswede/devops-frontend:${IMAGE_TAG}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/devops-production-app
            echo "IMAGE_TAG=${IMAGE_TAG}" > .env
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d

      - name: Healthcheck
        run: curl http://${{ secrets.EC2_HOST }}/api/health