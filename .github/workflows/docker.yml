name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EC2_SECURITY_GROUP_NAME: devops-app-sg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build backend image
        run: docker build -t imswede/devops-backend:${IMAGE_TAG} ./app/backend

      - name: Build frontend image
        run: docker build -t imswede/devops-frontend:${IMAGE_TAG} ./app/frontend

      - name: Push backend image
        run: docker push imswede/devops-backend:${IMAGE_TAG}

      - name: Push frontend image
        run: docker push imswede/devops-frontend:${IMAGE_TAG}

      - name: Authorize GitHub runner SSH access
        id: ssh_ingress
        run: |
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '\n')"
          SECURITY_GROUP_ID="$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${EC2_SECURITY_GROUP_NAME}" \
            --query "SecurityGroups[0].GroupId" \
            --output text)"

          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          echo "security_group_id=${SECURITY_GROUP_ID}" >> "$GITHUB_OUTPUT"

          aws ec2 authorize-security-group-ingress \
            --group-id "${SECURITY_GROUP_ID}" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" 2>authorize-error.log || {
              if grep -q "InvalidPermission.Duplicate" authorize-error.log; then
                echo "SSH ingress already exists for ${RUNNER_IP}/32"
              else
                cat authorize-error.log
                exit 1
              fi
            }

      - name: Wait for SSH port
        run: |
          for i in {1..12}; do
            if timeout 5 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.EC2_HOST }}/22'; then
              exit 0
            fi
            sleep 5
          done
          echo "SSH port 22 did not open on EC2_HOST."
          exit 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            sudo chown -R $USER:$USER ~/devops-production-app
            cd ~/devops-production-app
            git pull --ff-only origin main
            echo "IMAGE_TAG=$IMAGE_TAG" > .env
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Healthcheck
        run: |
          for i in {1..12}; do
            curl -fsS http://${{ secrets.EC2_HOST }}/api/health && exit 0
            sleep 5
          done
          exit 1

      - name: Revoke GitHub runner SSH access
        if: always() && steps.ssh_ingress.outputs.security_group_id != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ steps.ssh_ingress.outputs.security_group_id }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.ssh_ingress.outputs.runner_ip }}/32" || true
